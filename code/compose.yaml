name: project-pmp

x-app: &app
    build:
        context: .
    image: project-pmp-app:local
    init: true
    environment:
        APP_NAME: Project PMP
        APP_ENV: local
        APP_DEBUG: 'true'
        APP_URL: http://localhost:${APP_PORT:-8000}
        LOG_CHANNEL: stderr
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: '3306'
        DB_DATABASE: project_pmp
        DB_USERNAME: root
        DB_PASSWORD: ''
        SESSION_DRIVER: database
        CACHE_STORE: database
        QUEUE_CONNECTION: database
        MAIL_MAILER: log
    volumes:
        - app-storage:/var/www/html/storage

services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: project_pmp
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
            MYSQL_ROOT_HOST: '%'
        command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysql',
                    '--host=127.0.0.1',
                    '--user=root',
                    'project_pmp',
                    '--execute=SELECT 1',
                ]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 20s
        restart: unless-stopped

    setup:
        <<: *app
        command: ['setup']
        depends_on:
            mysql:
                condition: service_healthy
        restart: 'no'

    app:
        <<: *app
        ports:
            - '127.0.0.1:${APP_PORT:-8000}:8000'
        depends_on:
            setup:
                condition: service_completed_successfully
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8000/up']
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 10s
        restart: unless-stopped

    queue:
        <<: *app
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=60', '--sleep=3']
        depends_on:
            setup:
                condition: service_completed_successfully
        stop_grace_period: 70s
        restart: unless-stopped

volumes:
    mysql-data:
    app-storage:
