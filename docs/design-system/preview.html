<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shadcn/ui · Shark Theme · Perpus Merah Putih</title><style>body{margin:0;color:var(--foreground,#000);font-family:var(--font-sans,Arial,sans-serif)}.controls{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}select{box-sizing:border-box;padding:10px 12px;border:1px solid var(--border,#000);border-radius:6px;background:var(--card,#fff);color:inherit;font:inherit}#view{flex:1;min-width:220px}label{font-size:13px;white-space:nowrap}.scroll{overflow:auto;border:1px solid var(--border,#000);border-radius:8px}img{display:none;width:100%;height:auto}.actual img{width:auto;max-width:none}.scroll:not(.actual) img.mobile{max-width:390px;margin:0 auto}</style></head><body><div class="controls"><select id="view" aria-label="Pilih board"><option value="screen-catalog">Katalog mahasiswa · Desktop</option><option value="screen-admin">Peminjaman pustakawan · Desktop</option><option value="screen-mobile">Katalog mahasiswa · Mobile</option><option value="board-foundations">Foundations</option><option value="board-buttons">Buttons and navigation</option><option value="board-forms">Forms and feedback</option><option value="board-patterns">Library patterns</option></select><select id="mode" aria-label="Pilih mode"><option value="">Light</option><option value="-dark">Dark</option></select><label><input id="actual" type="checkbox"> Ukuran asli</label></div><div class="scroll" id="canvas"><img id="screen-catalog" class="" src="screen-catalog.png" alt="Katalog mahasiswa · Desktop · Light" style="display:block"><img id="screen-admin" class="" src="screen-admin.png" alt="Peminjaman pustakawan · Desktop · Light"><img id="screen-mobile" class="mobile" src="screen-mobile.png" alt="Katalog mahasiswa · Mobile · Light"><img id="board-foundations" class="" src="board-foundations.png" alt="Foundations · Light"><img id="board-buttons" class="" src="board-buttons.png" alt="Buttons and navigation · Light"><img id="board-forms" class="" src="board-forms.png" alt="Forms and feedback · Light"><img id="board-patterns" class="" src="board-patterns.png" alt="Library patterns · Light"><img id="screen-catalog-dark" class="" src="screen-catalog-dark.png" alt="Katalog mahasiswa · Desktop · Dark"><img id="screen-admin-dark" class="" src="screen-admin-dark.png" alt="Peminjaman pustakawan · Desktop · Dark"><img id="screen-mobile-dark" class="mobile" src="screen-mobile-dark.png" alt="Katalog mahasiswa · Mobile · Dark"><img id="board-foundations-dark" class="" src="board-foundations-dark.png" alt="Foundations · Dark"><img id="board-buttons-dark" class="" src="board-buttons-dark.png" alt="Buttons and navigation · Dark"><img id="board-forms-dark" class="" src="board-forms-dark.png" alt="Forms and feedback · Dark"><img id="board-patterns-dark" class="" src="board-patterns-dark.png" alt="Library patterns · Dark"></div><script>const view=document.getElementById('view'),mode=document.getElementById('mode');function update(){document.querySelectorAll('img').forEach(im=>im.style.display=im.id===view.value+mode.value?'block':'none')}view.addEventListener('change',update);mode.addEventListener('change',update);document.getElementById('actual').addEventListener('change',e=>document.getElementById('canvas').classList.toggle('actual',e.target.checked));</script></body></html>
