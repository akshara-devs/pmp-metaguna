1"/><rect x="1089.0" y="340" width="302.0" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="1240.0" y="358" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Baca aturan, kuota, antrean, status buku</text><path d="M1480 440 L1000 440" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M1000 440 L1011 435 L1011 445 Z" fill="#003E51"/><rect x="1177.75" y="410" width="124.5" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="1240.0" y="428" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Hasil validasi </text><path d="M1000 580 L1480 580" fill="none" stroke="#003E51" stroke-width="1.8"/><path d="M1480 580 L1469 575 L1469 585 Z" fill="#003E51"/><rect x="1110.3" y="550" width="259.4" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="1240.0" y="568" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Simpan sebagai WAITING atau QUEUED</text><path d="M1480 650 L1000 650" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M1000 650 L1011 645 L1011 655 Z" fill="#003E51"/><rect x="1156.45" y="620" width="167.1" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="1240.0" y="638" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">ID dan posisi antrean</text><path d="M1000 720 L550 720" fill="none" stroke="#00758D" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M550 720 L561 715 L561 725 Z" fill="#00758D"/><rect x="702.1" y="690" width="145.8" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="775.0" y="708" font-family="Arial" font-size="14" font-weight="400" fill="#00758D" text-anchor="middle">Pengajuan tercatat</text><path d="M550 790 L160 790" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M160 790 L171 785 L171 795 Z" fill="#003E51"/><rect x="250.15" y="760" width="209.7" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="355.0" y="778" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Tampilkan status dan posisi</text><path d="M1000 920 L550 920" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M550 920 L561 915 L561 925 Z" fill="#003E51"/><rect x="695.0" y="890" width="160.0" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="775.0" y="908" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Tolak beserta alasan</text><path d="M550 990 L160 990" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M160 990 L171 985 L171 995 Z" fill="#003E51"/><rect x="289.2" y="960" width="131.6" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="355.0" y="978" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Tampilkan alasan</text><text x="64" y="1133" font-family="Arial" font-size="14" font-weight="400" fill="#696F80" text-anchor="start">Awal transaksi: kunci akun dan judul, lalu validasi kembali. Commit setelah data tersimpan.</text><text x="64" y="1160" font-family="Arial" font-size="14" font-weight="400" fill="#696F80" text-anchor="start">WAITING jika buku tersedia; QUEUED jika tidak. Keduanya belum menahan buku atau kuota.</text><path d="M64 1185 L1556 1185" fill="none" stroke="#696F80" stroke-width="0.7"/><text x="64" y="1265" font-family="Arial" font-size="14" font-weight="400" fill="#696F80" text-anchor="start">Garis penuh = call; garis putus-putus = return. Alt = percabangan. Kotak tipis = activation bar.</text></svg>