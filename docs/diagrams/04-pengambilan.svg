550 790 L160 790" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M160 790 L171 785 L171 795 Z" fill="#003E51"/><rect x="235.95" y="760" width="238.1" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="355.0" y="778" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Tampilkan bukti dan jatuh tempo</text><path d="M1000 920 L1480 920" fill="none" stroke="#003E51" stroke-width="1.8"/><path d="M1480 920 L1469 915 L1469 925 Z" fill="#003E51"/><rect x="1103.2" y="890" width="273.6" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="1240.0" y="908" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Kedaluwarsa? Lepaskan penyiapan buku</text><path d="M1480 990 L1000 990" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M1000 990 L1011 985 L1011 995 Z" fill="#003E51"/><rect x="1110.3" y="960" width="259.4" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="1240.0" y="978" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Status akhir atau alasan penolakan</text><path d="M1000 1060 L550 1060" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M550 1060 L561 1055 L561 1065 Z" fill="#003E51"/><rect x="655.95" y="1030" width="238.1" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="775.0" y="1048" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Tolak penyerahan beserta alasan</text><text x="64" y="1203" font-family="Arial" font-size="14" font-weight="400" fill="#696F80" text-anchor="start">Pinjaman dimulai saat penyerahan. Versi kebijakan pinjaman diambil saat penyerahan, bukan saat pengajuan.</text><text x="64" y="1230" font-family="Arial" font-size="14" font-weight="400" fill="#696F80" text-anchor="start">Batas awal 5 hari. Ji