#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M1000 850 L1011 845 L1011 855 Z" fill="#003E51"/><rect x="1170.65" y="820" width="138.7" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="1240.0" y="838" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Tidak ada tagihan</text><path d="M1000 940 L1480 940" fill="none" stroke="#003E51" stroke-width="1.8"/><path d="M1480 940 L1469 935 L1469 945 Z" fill="#003E51"/><rect x="1096.1" y="910" width="287.8" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="1240.0" y="928" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Buku tersedia; evaluasi antrean tertua</text><path d="M1480 1010 L1000 1010" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M1000 1010 L1011 1005 L1011 1015 Z" fill="#003E51"/><rect x="1120.95" y="980" width="238.1" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="1240.0" y="998" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Commit pengembalian dan antrean</text><path d="M1000 1080 L550 1080" fill="none" stroke="#00758D" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M550 1080 L561 1075 L561 1085 Z" fill="#00758D"/><rect x="691.45" y="1050" width="167.1" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="775.0" y="1068" font-family="Arial" font-size="14" font-weight="400" fill="#00758D" text-anchor="middle">Pengembalian tercatat</text><path d="M550 1150 L160 1150" fill="none" stroke="#003E51" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M160 1150 L171 1145 L171 1155 Z" fill="#003E51"/><rect x="232.4" y="1120" width="245.2" height="24" rx="0" fill="#FAFAF7" stroke="none" stroke-width="1.5"/><text x="355.0" y="1138" font-family="Arial" font-size="14" font-weight="400" fill="#003E51" text-anchor="middle">Tampilkan bukti dan jumlah denda</text><text x="64" y="1253" font-family="Arial" font-size="14" font-weight="400" fill="#696F80" text-anchor="start">Denda = selisih tanggal lokal positif × tarif pinjaman. Kembali 31 Okt, tempo 29 Okt: 2 × Rp1.000.</text><text x="64" y="1280" font-family="Arial" font-size="14" font-weight="400" fill="#696F80" text-anchor="start">Buku tidak layak dinonaktifkan dalam transaksi yang sama. Antrean tetap memerlukan persetujuan.</text><path d="M64 1305 L1556 1305" fill="none" stroke="#696F80" stroke-width="0.7"/><text x="64" y="1385" font-family="Arial" font-size="14" font-weight="400" fill="#696F80" text-anchor="start">Garis penuh = call; garis putus-putus = return. Alt = percabangan. Kotak tipis = activation bar.</text></svg>