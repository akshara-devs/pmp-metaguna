<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola buku per ISBN</title><style>body{margin:0;font-family:var(--font-sans,Arial);color:var(--foreground,#000)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select{padding:8px;border:1px solid var(--border,#000);border-radius:6px;background:var(--card,#fff);color:inherit}#screen{flex:1;min-width:190px}.canvas{overflow:auto;border:1px solid var(--border,#000);border-radius:8px}img{display:none;width:100%;height:auto}</style><div class="controls"><select id="screen" aria-label="Layar"><option value="list">Daftar buku</option><option value="add">Tambah buku</option><option value="detail">Detail buku</option><option value="edit">Edit buku</option><option value="deactivate">Nonaktifkan buku</option><option value="empty">Pencarian kosong</option><option value="list-collapsed">Daftar dengan sidebar collapsed</option><option value="isbn-error">ISBN sudah digunakan</option></select><select id="mode" aria-label="Mode"><option value="light">Light</option><option value="dark">Dark</option></select><select id="state" aria-label="Sidebar"><option value="expanded">Expanded</option><option value="collapsed">Collapsed</option></select></div><div class="canvas"><img id="list-expanded-light" src="responsive-list-expanded-light.png" alt="Daftar buku · expanded · light"><img id="list-collapsed-light" src="responsive-list-collapsed-light.png" alt="Daftar buku · collapsed · light"><img id="list-expanded-dark" src="responsive-list-expanded-dark.png" alt="Daftar buku · expanded · dark"><img id="list-collapsed-dark" src="responsive-list-collapsed-dark.png" alt="Daftar buku · collapsed · dark"><img id="add-expanded-light" src="responsive-add-expanded-light.png" alt="Tambah buku · expanded · light"><img id="add-collapsed-light" src="responsive-add-collapsed-light.png" alt="Tambah buku · collapsed · light"><img id="add-expanded-dark" src="responsive-add-expanded-dark.png" alt="Tambah buku · expanded · dark"><img id="add-collapsed-dark" src="responsive-add-collapsed-dark.png" alt="Tambah buku · collapsed · dark"><img id="detail-expanded-light" src="responsive-detail-expanded-light.png" alt="Detail buku · expanded · light"><img id="detail-collapsed-light" src="responsive-detail-collapsed-light.png" alt="Detail buku · collapsed · light"><img id="detail-expanded-dark" src="responsive-detail-expanded-dark.png" alt="Detail buku · expanded · dark"><img id="detail-collapsed-dark" src="responsive-detail-collapsed-dark.png" alt="Detail buku · collapsed · dark"><img id="edit-expanded-light" src="responsive-edit-expanded-light.png" alt="Edit buku · expanded · light"><img id="edit-collapsed-light" src="responsive-edit-collapsed-light.png" alt="Edit buku · collapsed · light"><img id="edit-expanded-dark" src="responsive-edit-expanded-dark.png" alt="Edit buku · expanded · dark"><img id="edit-collapsed-dark" src="responsive-edit-collapsed-dark.png" alt="Edit buku · collapsed · dark"><img id="deactivate-expanded-light" src="responsive-deactivate-expanded-light.png" alt="Nonaktifkan buku · expanded · light"><img id="deactivate-collapsed-light" src="responsive-deactivate-collapsed-light.png" alt="Nonaktifkan buku · collapsed · light"><img id="deactivate-expanded-dark" src="responsive-deactivate-expanded-dark.png" alt="Nonaktifkan buku · expanded · dark"><img id="deactivate-collapsed-dark" src="responsive-deactivate-collapsed-dark.png" alt="Nonaktifkan buku · collapsed · dark"><img id="empty-expanded-light" src="responsive-empty-expanded-light.png" alt="Pencarian kosong · expanded · light"><img id="empty-collapsed-light" src="responsive-empty-collapsed-light.png" alt="Pencarian kosong · collapsed · light"><img id="empty-expanded-dark" src="responsive-empty-expanded-dark.png" alt="Pencarian kosong · expanded · dark"><img id="empty-collapsed-dark" src="responsive-empty-collapsed-dark.png" alt="Pencarian kosong · collapsed · dark"><img id="list-collapsed-expanded-light" src="responsive-list-collapsed-expanded-light.png" alt="Daftar dengan sidebar collapsed · expanded · light"><img id="list-collapsed-collapsed-light" src="responsive-list-collapsed-collapsed-light.png" alt="Daftar dengan sidebar collapsed · collapsed · light"><img id="list-collapsed-expanded-dark" src="responsive-list-collapsed-expanded-dark.png" alt="Daftar dengan sidebar collapsed · expanded · dark"><img id="list-collapsed-collapsed-dark" src="responsive-list-collapsed-collapsed-dark.png" alt="Daftar dengan sidebar collapsed · collapsed · dark"><img id="isbn-error-expanded-light" src="responsive-isbn-error-expanded-light.png" alt="ISBN sudah digunakan · expanded · light"><img id="isbn-error-collapsed-light" src="responsive-isbn-error-collapsed-light.png" alt="ISBN sudah digunakan · collapsed · light"><img id="isbn-error-expanded-dark" src="responsive-isbn-error-expanded-dark.png" alt="ISBN sudah digunakan · expanded · dark"><img id="isbn-error-collapsed-dark" src="responsive-isbn-error-collapsed-dark.png" alt="ISBN sudah digunakan · collapsed · dark"></div><script>const screen=document.getElementById('screen'),mode=document.getElementById('mode'),state=document.getElementById('state');function update(){document.querySelectorAll('img').forEach(im=>im.style.display=im.id===screen.value+'-'+state.value+'-'+mode.value?'block':'none')}for(const el of[screen,mode,state])el.addEventListener('change',update);update();</script></html>
